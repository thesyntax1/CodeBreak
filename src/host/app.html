<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeBreak — Binary Analysis Suite</title>
<style>
:root {
  --bg: #0b0e14;
  --panel: #121722;
  --panel2: #171e2c;
  --border: #232c40;
  --border2: #2d3a55;
  --text: #d7e0f0;
  --dim: #8b98b4;
  --dim2: #5f6c88;
  --accent: #4d9fff;
  --accent2: #7c6cf0;
  --good: #3fd68f;
  --warn: #f5c451;
  --bad: #ff6b6b;
  --info: #6cb6ff;
  --mono: "Cascadia Code", "Consolas", "JetBrains Mono", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  font-size: 13px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a3450; border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: #38466b; }

#topbar {
  height: 52px;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 16px;
  background: linear-gradient(180deg, #131a2a, #0f141f);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#logo { display: flex; align-items: center; gap: 10px; user-select: none; }
#logo .mark {
  width: 30px; height: 30px; border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-weight: 700; font-size: 14px; color: #fff;
  box-shadow: 0 2px 10px rgba(77,159,255,.35);
}
#logo .name { font-size: 16px; font-weight: 600; letter-spacing: .3px; }
#logo .name span { color: var(--accent); }
#logo .tag { font-size: 10px; color: var(--dim2); margin-top: 1px; }
#openBtn {
  height: 34px; padding: 0 18px; border: none; border-radius: 7px;
  background: linear-gradient(135deg, var(--accent), #3b7fe0);
  color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; gap: 8px;
}
#openBtn:hover { filter: brightness(1.12); }
#openBtn:active { filter: brightness(.92); }
#exportBtn {
  height: 34px; padding: 0 14px; border: 1px solid var(--border2); border-radius: 7px;
  background: var(--panel); color: var(--text); font-size: 12px; font-weight: 600;
  cursor: pointer; display: flex; align-items: center; gap: 7px; flex-shrink: 0;
}
#exportBtn:hover { border-color: var(--accent); color: var(--accent); }
#exportBtn:disabled { opacity: .4; cursor: default; }
#fileChip {
  flex: 1; min-width: 0; display: none; align-items: center; gap: 10px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 7px;
  height: 34px; padding: 0 12px; overflow: hidden;
}
#fileChip .fname { font-family: var(--mono); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#fileChip .fsize { color: var(--dim); font-size: 11px; white-space: nowrap; }
#fmtBadge {
  font-size: 10px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
  padding: 3px 8px; border-radius: 4px; background: rgba(77,159,255,.15);
  color: var(--accent); border: 1px solid rgba(77,159,255,.35); white-space: nowrap;
}
#perfChip { color: var(--dim2); font-size: 11px; font-family: var(--mono); white-space: nowrap; }

#main { flex: 1; display: flex; min-height: 0; }
#sidebar {
  width: 216px; flex-shrink: 0; background: var(--panel);
  border-right: 1px solid var(--border); display: flex; flex-direction: column;
  overflow-y: auto;
}
.navtab {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  color: var(--dim); cursor: pointer; border-left: 2px solid transparent;
  font-size: 13px; user-select: none;
}
.navtab:hover { color: var(--text); background: rgba(255,255,255,.02); }
.navtab.active { color: var(--accent); border-left-color: var(--accent); background: rgba(77,159,255,.07); font-weight: 600; }
.navtab .ic { width: 16px; text-align: center; font-family: var(--mono); font-size: 12px; opacity: .85; }
.navtab .cnt { margin-left: auto; font-size: 10px; color: var(--dim2); background: var(--panel2); border: 1px solid var(--border); padding: 1px 6px; border-radius: 8px; }

#content { flex: 1; overflow-y: auto; padding: 20px 24px; min-width: 0; }
.page { display: none; }
.page.active { display: block; animation: fadein .15s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 18px; color: var(--dim); }
.welcome .bigic { font-size: 64px; opacity: .25; }
.welcome h2 { font-weight: 400; color: var(--dim); }
.welcome kbd { background: var(--panel2); border: 1px solid var(--border2); border-radius: 4px; padding: 2px 6px; font-family: var(--mono); font-size: 11px; }

h3.sec { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim2); margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }
h3.sec:first-child { margin-top: 0; }
h3.sec::after { content: ""; flex: 1; height: 1px; background: var(--border); }

.grid { display: grid; gap: 12px; }
.g2 { grid-template-columns: 1fr 1fr; }
.g3 { grid-template-columns: 1fr 1fr 1fr; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.card h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--dim); margin-bottom: 10px; }

.kv { display: flex; gap: 10px; padding: 3px 0; font-size: 12.5px; }
.kv .k { color: var(--dim); width: 150px; flex-shrink: 0; }
.kv .v { font-family: var(--mono); font-size: 12px; word-break: break-all; }
.kv .v.click { color: var(--accent); cursor: pointer; }
.kv .v.click:hover { text-decoration: underline; }

table.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.tbl th {
  text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .7px;
  color: var(--dim2); padding: 7px 10px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--panel); z-index: 2; white-space: nowrap;
}
.tbl td { padding: 6px 10px; border-bottom: 1px solid rgba(35,44,64,.5); font-family: var(--mono); font-size: 11.5px; white-space: nowrap; }
.tbl tr:hover td { background: rgba(77,159,255,.05); }
.tbl tr.click { cursor: pointer; }
.tbl td.dim { color: var(--dim); }
.tblwrap { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: auto; max-height: 60vh; }

.badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px; margin: 1px 3px 1px 0; font-family: var(--mono); }
.badge.b-blue { background: rgba(77,159,255,.12); color: var(--accent); border: 1px solid rgba(77,159,255,.3); }
.badge.b-green { background: rgba(63,214,143,.1); color: var(--good); border: 1px solid rgba(63,214,143,.3); }
.badge.b-yellow { background: rgba(245,196,81,.1); color: var(--warn); border: 1px solid rgba(245,196,81,.3); }
.badge.b-red { background: rgba(255,107,107,.1); color: var(--bad); border: 1px solid rgba(255,107,107,.3); }
.badge.b-gray { background: rgba(139,152,180,.08); color: var(--dim); border: 1px solid rgba(139,152,180,.25); }
.badge.b-purple { background: rgba(124,108,240,.12); color: #a99cf5; border: 1px solid rgba(124,108,240,.35); }

.ebar { position: relative; height: 6px; border-radius: 3px; background: #1c2436; width: 90px; overflow: hidden; }
.ebar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }

.hashrow { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.hashrow .hk { color: var(--dim); font-size: 11px; width: 62px; flex-shrink: 0; font-weight: 600; }
.hashrow .hv { font-family: var(--mono); font-size: 11.5px; color: #b8c6e4; word-break: break-all; flex: 1; }
.copybtn { background: none; border: 1px solid var(--border2); color: var(--dim); border-radius: 4px; font-size: 10px; padding: 2px 7px; cursor: pointer; flex-shrink: 0; }
.copybtn:hover { color: var(--accent); border-color: var(--accent); }

.ind { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: 8px; margin-bottom: 6px; border: 1px solid var(--border); background: var(--panel); }
.ind .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
.ind .t { font-weight: 600; font-size: 12.5px; }
.ind .d { color: var(--dim); font-size: 11.5px; margin-top: 2px; line-height: 1.45; }
.ind.s2 .dot { background: var(--bad); box-shadow: 0 0 8px var(--bad); }
.ind.s1 .dot { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
.ind.s0 .dot { background: var(--info); box-shadow: 0 0 8px var(--info); }
.ind.s2 { border-color: rgba(255,107,107,.35); }
.ind.s1 { border-color: rgba(245,196,81,.3); }

#entropyCanvas { width: 100%; height: 140px; display: block; background: #0d1220; border-radius: 6px; border: 1px solid var(--border); }
.enthover { position: absolute; pointer-events: none; background: #1c2438; border: 1px solid var(--border2); padding: 6px 9px; border-radius: 6px; font-family: var(--mono); font-size: 10.5px; display: none; z-index: 10; white-space: nowrap; }

.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.toolbar input[type=text] {
  background: var(--panel2); border: 1px solid var(--border2); color: var(--text);
  border-radius: 7px; padding: 7px 12px; font-size: 12px; font-family: var(--mono);
  outline: none; width: 280px;
}
.toolbar input[type=text]:focus { border-color: var(--accent); }
.toolbar select {
  background: var(--panel2); border: 1px solid var(--border2); color: var(--text);
  border-radius: 7px; padding: 6px 8px; font-size: 12px; outline: none;
}
.toolbar .spacer { flex: 1; }
.toolbar .meta { color: var(--dim2); font-size: 11px; font-family: var(--mono); }

#stringsList { display: flex; flex-direction: column; gap: 1px; }
.strow { display: flex; gap: 12px; padding: 3px 10px; font-family: var(--mono); font-size: 12px; border-radius: 4px; cursor: pointer; align-items: baseline; }
.strow:hover { background: rgba(77,159,255,.08); }
.strow .so { color: var(--dim2); font-size: 10.5px; width: 110px; flex-shrink: 0; }
.strow .sw { color: var(--accent2); font-size: 9px; width: 34px; flex-shrink: 0; }
.strow .st { color: #c9d6ee; word-break: break-all; white-space: pre-wrap; }
.strow .st b { color: var(--warn); font-weight: 600; }

.hexwrap { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-family: var(--mono); font-size: 12px; overflow: auto; max-height: calc(100vh - 220px); }
.hexrow { display: flex; gap: 0; white-space: nowrap; line-height: 1.65; }
.hexrow .ho { color: var(--dim2); width: 96px; flex-shrink: 0; user-select: none; }
.hexrow .hb { color: #9fb4dd; }
.hexrow .hb .sel { background: rgba(77,159,255,.25); border-radius: 2px; }
.hexrow .ha { color: #6f7d9c; margin-left: 18px; }
.hexrow .ha .pr { color: #c9d6ee; }

details.node { margin-left: 0; }
details.node > summary { cursor: pointer; padding: 4px 8px; border-radius: 5px; display: flex; gap: 8px; align-items: center; font-family: var(--mono); font-size: 12px; }
details.node > summary:hover { background: rgba(77,159,255,.07); }
details.node > .children { margin-left: 18px; border-left: 1px solid var(--border); padding-left: 8px; }
.treearr { color: var(--dim2); font-size: 10px; width: 12px; }
.tagname { color: var(--accent2); }
.attrlist { color: var(--dim); font-size: 11px; }
.attrlist b { color: var(--warn); font-weight: 500; }

.searchbar { margin-bottom: 10px; }
.searchbar input { width: 100%; background: var(--panel2); border: 1px solid var(--border2); color: var(--text); border-radius: 7px; padding: 7px 12px; font-size: 12px; outline: none; font-family: var(--mono); }
.searchbar input:focus { border-color: var(--accent); }

code.block { display: block; background: #0d1220; border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; word-break: break-all; color: #b8c6e4; max-height: 400px; overflow: auto; line-height: 1.5; }

#dropOverlay {
  position: fixed; inset: 0; background: rgba(8,12,22,.82); z-index: 100;
  display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
  border: 3px dashed var(--accent); border-radius: 12px;
}
#dropOverlay .ic { font-size: 56px; }
#dropOverlay .t { font-size: 18px; font-weight: 600; color: var(--accent); }

#loading { position: fixed; inset: 0; background: rgba(8,12,22,.72); z-index: 99; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
.spinner { width: 42px; height: 42px; border: 3px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#loading .t { color: var(--dim); font-size: 13px; font-family: var(--mono); }

#toasts { position: fixed; right: 18px; bottom: 44px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast { background: #1c2438; border: 1px solid var(--border2); border-left: 3px solid var(--bad); padding: 10px 14px; border-radius: 8px; font-size: 12.5px; max-width: 420px; box-shadow: 0 6px 24px rgba(0,0,0,.4); animation: fadein .15s ease; }
.toast.ok { border-left-color: var(--good); }

#statusbar {
  height: 26px; background: var(--panel); border-top: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 14px; gap: 18px;
  color: var(--dim2); font-size: 11px; font-family: var(--mono); flex-shrink: 0;
}
#statusbar .sb-right { margin-left: auto; }

.permrow { display: flex; align-items: center; gap: 8px; padding: 5px 10px; background: var(--panel2); border: 1px solid var(--border); border-radius: 7px; margin-bottom: 5px; font-family: var(--mono); font-size: 11.5px; }
.permrow .sev { font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 3px; }
.permrow .sev.danger { background: rgba(255,107,107,.15); color: var(--bad); }
.riskgauge { display: flex; align-items: center; gap: 18px; }
.riskgauge .ring { position: relative; width: 96px; height: 96px; flex-shrink: 0; }
.riskgauge .ring svg { transform: rotate(-90deg); }
.riskgauge .ring .val { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 22px; font-weight: 700; }
.riskcat { display: flex; justify-content: space-between; padding: 5px 0; font-size: 12px; }
.riskcat .cat { text-transform: capitalize; color: var(--dim); }
.riskcat .w { font-family: var(--mono); color: var(--text); }
.permrow .sev.normal { background: rgba(108,182,255,.12); color: var(--info); }

.dexcard { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
.dexcard .hdr { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.dexcard .hdr .nm { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--accent); }
.statgrid { display: flex; gap: 10px; flex-wrap: wrap; }
.stat { background: var(--panel2); border: 1px solid var(--border); border-radius: 7px; padding: 8px 14px; min-width: 90px; }
.stat .n { font-family: var(--mono); font-size: 17px; font-weight: 600; color: var(--text); }
.stat .l { font-size: 9.5px; color: var(--dim2); text-transform: uppercase; letter-spacing: .6px; margin-top: 2px; }
.stat.warn .n { color: var(--bad); }
.stat.good .n { color: var(--good); }

.empty { color: var(--dim2); font-style: italic; padding: 16px 0; }
a { color: var(--accent); }
.mono { font-family: var(--mono); }
.dimt { color: var(--dim); }
</style>
</head>
<body>

<div id="topbar">
  <div id="logo">
    <div class="mark">&gt;_</div>
    <div>
      <div class="name">Code<span>Break</span></div>
      <div class="tag">BINARY ANALYSIS SUITE</div>
    </div>
  </div>
  <button id="openBtn">&#128193; Open File</button>
  <button id="exportBtn" title="Save a self-contained HTML report" style="display:none">&#128196; Report</button>
  <div id="fileChip">
    <span id="fmtBadge"></span>
    <span class="fname" id="chipName"></span>
    <span class="fsize" id="chipSize"></span>
  </div>
  <span id="perfChip"></span>
</div>

<div id="main">
  <div id="sidebar"></div>
  <div id="content">
    <div class="welcome" id="welcome">
      <div class="bigic">&#129517;</div>
      <h2>Drop a binary anywhere, or open a file</h2>
      <div>Supports <b>PE (EXE/DLL/SYS)</b> · <b>APK / ZIP / JAR</b> · <b>DEX</b> · <b>ELF</b> · <b>Mach-O</b> · <b>Java class</b></div>
      <div>or press <kbd>Ctrl+O</kbd></div>
    </div>
    <div id="pages"></div>
  </div>
</div>

<div id="statusbar">
  <span id="sbPath">No file loaded</span>
  <span id="sbHash"></span>
  <span class="sb-right">CodeBreak</span>
</div>

<div id="loading"><div class="spinner"></div><div class="t" id="loadingText">Analyzing&#8230;</div></div>
<div id="dropOverlay"><div class="ic">&#128230;</div><div class="t">Drop file to analyze</div></div>
<div id="toasts"></div>

<script>
"use strict";

const $ = s => document.querySelector(s);
const state = {
  data: null,
  pending: new Map(),
  reqId: 1,
  tab: "overview",
  strings: { items: [], total: 0, loading: false, minLen: 4, kind: 0, filter: "", exhausted: false },
  hex: { base: 0, rows: [] },
};

function toast(msg, ok) {
  const t = document.createElement("div");
  t.className = "toast" + (ok ? " ok" : "");
  t.textContent = msg;
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), 4200);
}

function send(cmd, extra) {
  return new Promise((resolve, reject) => {
    const id = state.reqId++;
    const msg = Object.assign({ id, cmd }, extra || {});
    state.pending.set(id, { resolve, reject });
    window.chrome.webview.postMessage(msg);
    setTimeout(() => {
      if (state.pending.has(id)) {
        state.pending.delete(id);
        reject(new Error("request timeout"));
      }
    }, 120000);
  });
}

window.chrome.webview.addEventListener("message", ev => {
  const m = ev.data;
  if (m.event === "drop") {
    if (m.paths && m.paths.length) analyzeFile(m.paths[0]);
    return;
  }
  const p = state.pending.get(m.id);
  if (!p) return;
  state.pending.delete(m.id);
  if (m.ok) p.resolve(m.data);
  else p.reject(new Error(m.error || "request failed"));
});

function fmtBytes(n) {
  if (n === undefined || n === null) return "";
  if (n >= 1073741824) return (n / 1073741824).toFixed(2) + " GB";
  if (n >= 1048576) return (n / 1048576).toFixed(2) + " MB";
  if (n >= 1024) return (n / 1024).toFixed(2) + " KB";
  return n + " B";
}
function hx(n, w) { return "0x" + (n >>> 0).toString(16).padStart(w || 0, "0"); }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;"); }

async function openDialog() {
  try {
    const r = await send("open");
    if (r && r.path) analyzeFile(r.path);
  } catch (e) { toast("Open failed: " + e.message); }
}

async function analyzeFile(path) {
  $("#loading").style.display = "flex";
  $("#loadingText").textContent = "Analyzing " + path.split(/[\\/]/).pop() + "\u2026";
  try {
    const data = await send("analyze", { path });
    state.data = data;
    state.tab = "overview";
    state.strings = { items: [], total: 0, loading: false, minLen: 4, kind: 0, filter: "", exhausted: false };
    state.hex = { base: 0, rows: [] };
    buildTabs(data);
    renderAll();
    $("#fileChip").style.display = "flex";
    $("#chipName").textContent = data.file.name;
    $("#chipSize").textContent = data.file.sizeHuman;
    $("#fmtBadge").textContent = data.format.label;
    $("#perfChip").textContent = data.analysisMs !== undefined ? "analyzed in " + data.analysisMs + " ms" : "";
    $("#sbPath").textContent = data.file.path;
    $("#sbHash").textContent = "SHA-256 " + data.hashes.sha256.slice(0, 24) + "\u2026";
    $("#welcome").style.display = "none";
    $("#exportBtn").style.display = "inline-flex";
  } catch (e) {
    toast("Analysis failed: " + e.message);
  } finally {
    $("#loading").style.display = "none";
  }
}

const TAB_ICONS = {
  overview: "\u25CE", risk: "\u26A1", headers: "\u2261", sections: "\u2630", imports: "\u21C4", exports: "\u21C0",
  resources: "\u2699", strings: "\u201C", hex: "#", manifest: "\u263C", dex: "\u2622",
  entries: "\u25A3", elfseg: "\u2192", elfsec: "\u2630", macho: "\u2318", javaclass: "\u2615",
};

function buildTabs(d) {
  const tabs = [{ id: "overview", label: "Overview" }, { id: "risk", label: "Risk" }];
  if (d.pe) {
    tabs.push({ id: "headers", label: "Headers" });
    tabs.push({ id: "sections", label: "Sections", cnt: d.pe.sections.length });
    tabs.push({ id: "imports", label: "Imports", cnt: d.pe.imports.length });
    if (d.pe.exports && d.pe.exports.symbols && d.pe.exports.symbols.length) tabs.push({ id: "exports", label: "Exports", cnt: d.pe.exports.symbols.length });
    tabs.push({ id: "resources", label: "Resources" });
  }
  if (d.apk) {
    tabs.push({ id: "manifest", label: "Android" });
    tabs.push({ id: "dex", label: "DEX", cnt: d.apk.dex.length });
  }
  if (d.zip) tabs.push({ id: "entries", label: "Archive", cnt: d.zip.entryCount });
  if (d.elf) {
    tabs.push({ id: "elfseg", label: "Segments", cnt: d.elf.programHeaders.length });
    tabs.push({ id: "elfsec", label: "Sections", cnt: d.elf.sections.length });
  }
  if (d.macho) tabs.push({ id: "macho", label: "Load Commands", cnt: d.macho.loadCommands.length });
  if (d.javaclass) tabs.push({ id: "javaclass", label: "Class Info" });
  tabs.push({ id: "strings", label: "Strings", cnt: d.stringsInfo.total });
  tabs.push({ id: "hex", label: "Hex View" });
  const sb = $("#sidebar");
  sb.innerHTML = "";
  for (const t of tabs) {
    const el = document.createElement("div");
    el.className = "navtab";
    el.dataset.tab = t.id;
    el.innerHTML = "<span class='ic'>" + (TAB_ICONS[t.id] || "\u2022") + "</span><span>" + esc(t.label) + "</span>" +
      (t.cnt !== undefined ? "<span class='cnt'>" + t.cnt + "</span>" : "");
    el.onclick = () => selectTab(t.id);
    sb.appendChild(el);
  }
  $("#pages").innerHTML = tabs.map(t => "<div class='page' id='page-" + t.id + "'></div>").join("");
  selectTab("overview");
}

function selectTab(id) {
  state.tab = id;
  document.querySelectorAll(".navtab").forEach(n => n.classList.toggle("active", n.dataset.tab === id));
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("active", p.id === "page-" + id));
  if (id === "strings") ensureStringsPage();
  if (id === "hex") ensureHexPage();
}

function renderAll() {
  renderOverview();
  renderRisk();
  if (state.data.pe) { renderHeaders(); renderSections(); renderImports(); renderExports(); renderResources(); }
  if (state.data.apk) { renderManifest(); renderDex(); }
  if (state.data.zip) renderEntries();
  if (state.data.elf) { renderElfSeg(); renderElfSec(); }
  if (state.data.macho) renderMacho();
  if (state.data.javaclass) renderJava();
}

function page(id) { return $("#page-" + id); }
function kvRow(k, v, click) {
  if (v === undefined || v === null || v === "") return "";
  return "<div class='kv'><span class='k'>" + esc(k) + "</span><span class='v" + (click ? " click' data-jump='" + click : "") + "'>" + v + "</span></div>";
}
function badges(list, cls) { return list.map(x => "<span class='badge " + (cls || "b-gray") + "'>" + esc(x) + "</span>").join(" "); }
function entropyColor(e) {
  if (e >= 7.5) return "#ff6b6b";
  if (e >= 7.0) return "#f5a451";
  if (e >= 6.0) return "#f5c451";
  if (e >= 4.0) return "#6cb6ff";
  return "#3fd68f";
}
function ebar(e) {
  return "<div class='ebar' title='entropy " + e.toFixed(3) + "'><div class='fill' style='width:" + (e / 8 * 100).toFixed(1) + "%;background:" + entropyColor(e) + "'></div></div>";
}
function riskColor(lv) {
  switch (lv) {
    case "critical": return "#ff2d55";
    case "high": return "#ff6b6b";
    case "medium": return "#f5c451";
    case "low": return "#6cb6ff";
    default: return "#3fd68f";
  }
}
function riskGauge(score, level) {
  const c = riskColor(level);
  const r = 40, C = 2 * Math.PI * r;
  const off = C * (1 - score / 100);
  return "<div class='riskgauge'><div class='ring'><svg width='96' height='96'>" +
    "<circle cx='48' cy='48' r='" + r + "' fill='none' stroke='#1c2436' stroke-width='8'/>" +
    "<circle cx='48' cy='48' r='" + r + "' fill='none' stroke='" + c + "' stroke-width='8' stroke-linecap='round' stroke-dasharray='" + C + "' stroke-dashoffset='" + off + "'/></svg>" +
    "<div class='val' style='color:" + c + "'>" + score + "</div></div>" +
    "<div><div style='font-size:15px;font-weight:700;color:" + c + ";text-transform:uppercase'>" + esc(level) + "</div>" +
    "<div class='dimt' style='font-size:11px'>weighted heuristic risk score</div></div></div>";
}

function jumpHex(off) {
  selectTab("hex");
  hexGoto(off);
}

document.addEventListener("click", ev => {
  const j = ev.target.closest("[data-jump]");
  if (j) jumpHex(parseInt(j.dataset.jump, 10));
});

function renderRisk() {
  const d = state.data;
  const r = d.risk;
  const p = page("risk");
  if (!r) { p.innerHTML = "<div class='empty'>No risk assessment available.</div>"; return; }
  const c = riskColor(r.level);

  h += "<div class='grid g2'><div class='card'><h4>Contributing Signals (" + (r.signals || []).length + ")</h4>";
  if (!r.signals || !r.signals.length) h += "<div class='empty'>No weighted signals fired.</div>";
  else {
    const maxW = Math.max.apply(null, r.signals.map(s => s.weight));
    h += r.signals.map(s => {

      return "<div class='ind s0' style='margin-bottom:8px'><div class='dot' style='background:" + c + ";box-shadow:0 0 8px " + c + "'></div><div style='flex:1'><div class='t'>" + esc(s.category) + " <span class='badge b-gray'>+" + s.weight + " pts</span>" + (s.hits > 1 ? " <span class='badge b-blue'>x" + s.hits + "</span>" : "") + "</div>" +
        "<div class='d'>" + esc(s.title) + "</div>" +

}

function drawEntropy() {
  const cv = $("#entropyCanvas");
  if (!cv) return;
  const blocks = state.data.entropy.blocks;
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || 600, hgt = 140;
  cv.width = w * dpr; cv.height = hgt * dpr;
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, hgt);
  ctx.strokeStyle = "rgba(255,255,255,0.05)";
  for (let i = 1; i < 8; i++) {
    const y = hgt - (i / 8) * hgt;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
  const bw = w / blocks.length;
  for (let i = 0; i < blocks.length; i++) {
    const e = blocks[i].e;
    const bh = Math.max(1, (e / 8) * (hgt - 4));
    ctx.fillStyle = entropyColor(e);
    ctx.globalAlpha = 0.88;
    ctx.fillRect(i * bw, hgt - bh, Math.max(bw - 0.5, 0.5), bh);
  }
  cv.onmousemove = ev => {
    const rect = cv.getBoundingClientRect();
    const i = Math.min(blocks.length - 1, Math.max(0, Math.floor((ev.clientX - rect.left) / rect.width * blocks.length)));
    const tip = $("#enthover");
    tip.style.display = "block";
    tip.style.left = Math.min(rect.width - 160, ev.clientX - rect.left) + "px";
    tip.style.top = (ev.clientY - rect.top - 44) + "px";
    tip.innerHTML = "offset " + hx(blocks[i].off) + "<br>entropy " + blocks[i].e.toFixed(4);
  };
  cv.onmouseleave = () => { const tip = $("#enthover"); if (tip) tip.style.display = "none"; };
}

let stringsObs = null;
function ensureStringsPage() {
  const p = page("strings");
  if (!p.dataset.built) {
    p.dataset.built = "1";
    p.innerHTML = "<div class='toolbar'>" +
      "<input type='text' id='strFilter' placeholder='Filter (substring)\u2026'>" +
      "<select id='strKind'><option value='0'>All strings</option><option value='1'>ASCII only</option><option value='2'>UTF-16 only</option></select>" +
      "<select id='strMin'><option value='4'>Min length 4</option><option value='6'>Min length 6</option><option value='8'>Min length 8</option><option value='12'>Min length 12</option><option value='16'>Min length 16</option></select>" +
      "<span class='spacer'></span><span class='meta' id='strMeta'></span></div>" +
      "<div class='tblwrap' style='max-height:calc(100vh - 210px)'><div id='stringsList'></div><div id='stringsSentinel' style='height:40px'></div></div>";
    $("#strFilter").oninput = debounce(() => resetStrings(), 250);
    $("#strKind").onchange = () => resetStrings();
    $("#strMin").onchange = () => resetStrings();
    stringsObs = new IntersectionObserver(entries => {
      if (entries[0].isIntersecting) loadStrings();
    }, { root: $("#content") });
    stringsObs.observe($("#stringsSentinel"));
    resetStrings();
  }
}

function debounce(fn, ms) {
  let t = 0;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

function resetStrings() {
  state.strings.items = [];
  state.strings.total = 0;
  state.strings.exhausted = false;
  $("#stringsList").innerHTML = "";
  loadStrings();
}

async function loadStrings() {
  const s = state.strings;
  if (s.loading || s.exhausted || !state.data) return;
  s.loading = true;
  $("#strMeta").textContent = "loading\u2026";
  try {
    const r = await send("strings", {
      offset: s.items.length, count: 500,
      minLen: s.minLen, kind: s.kind, filter: s.filter
    });
    s.total = r.total;
    const q = s.filter.toLowerCase();
    const list = $("#stringsList");
    const frag = document.createDocumentFragment();
    for (const it of r.items) {
      let txt = esc(it.text);
      if (q) {
        const idx = it.text.toLowerCase().indexOf(q);
        if (idx >= 0) {
          const raw = it.text;
          txt = esc(raw.slice(0, idx)) + "<b>" + esc(raw.substr(idx, q.length)) + "</b>" + esc(raw.slice(idx + q.length));
        }
      }
      const row = document.createElement("div");
      row.className = "strow";
      row.innerHTML = "<span class='so'>" + hx(it.off) + "</span><span class='sw'>" + (it.wide ? "W" : "A") + "</span><span class='st'>" + txt + "</span>";
      row.onclick = () => jumpHex(it.off);
      frag.appendChild(row);
    }
    list.appendChild(frag);
    s.items = s.items.concat(r.items);
    if (r.items.length < 500) s.exhausted = true;
    $("#strMeta").textContent = s.items.length.toLocaleString() + " shown · " + s.total.toLocaleString() + " total" + (state.data.stringsInfo.truncated ? " (scan capped)" : "");
  } catch (e) {
    $("#strMeta").textContent = "error: " + e.message;
  } finally {
    s.loading = false;
  }
}

let hexBusy = false;
function ensureHexPage() {
  const p = page("hex");
  if (!p.dataset.built) {
    p.dataset.built = "1";
    p.innerHTML = "<div class='toolbar'>" +
      "<button class='copybtn' id='hexPrev' style='padding:6px 12px'>&#9650; Prev 4K</button>" +
      "<button class='copybtn' id='hexNext' style='padding:6px 12px'>&#9660; Next 4K</button>" +
      "<input type='text' id='hexGoto' placeholder='Go to offset (hex or dec)\u2026' style='width:220px'>" +
      "<span class='spacer'></span><span class='meta' id='hexMeta'></span></div>" +
      "<div class='hexwrap' id='hexBody'></div>";
    $("#hexGoto").onkeydown = ev => {
      if (ev.key === "Enter") {
        let v = ev.target.value.trim();
        let n = v.startsWith("0x") || v.startsWith("0X") || /[a-f]/i.test(v) ? parseInt(v.replace(/^0x/i, ""), 16) : parseInt(v, 10);
        if (!isNaN(n)) hexGoto(n);
      }
    };
    $("#hexPrev").onclick = () => hexGoto(state.hex.base - 4096);
    $("#hexNext").onclick = () => hexGoto(state.hex.base + 4096);
    hexGoto(0);
  }
}

async function hexGoto(off) {
  const d = state.data;
  if (!d) return;
  if (off < 0) off = 0;
  if (off >= d.file.size) off = Math.max(0, d.file.size - 16);
  off = off & ~0xF;
  if (hexBusy) return;
  hexBusy = true;
  try {
    const r = await send("hex", { offset: off, length: 4096 });
    const bytes = r.bytes;
    let h = "";
    for (let i = 0; i < bytes.length; i += 16) {
      let hexPart = "", ascPart = "";
      for (let j = 0; j < 16; j++) {
        if (i + j < bytes.length) {
          const b = bytes[i + j];
          hexPart += b.toString(16).padStart(2, "0") + " ";
          ascPart += (b >= 0x20 && b < 0x7F) ? "<span class='pr'>" + String.fromCharCode(b).replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</span>" : "<span class='dp'>\u00B7</span>";
        } else { hexPart += "   "; ascPart += " "; }
        if (j === 7) hexPart += " ";
      }
      h += "<div class='hexrow'><span class='ho'>" + (r.offset + i).toString(16).padStart(8, "0") + "</span><span class='hb'>" + hexPart + "</span><span class='ha'>" + ascPart + "</span></div>";
    }
    $("#hexBody").innerHTML = h;
    state.hex.base = r.offset;
    $("#hexMeta").textContent = "offset " + hx(r.offset) + " \u2013 " + hx(r.offset + bytes.length) + " of " + hx(d.file.size) + " (" + d.file.sizeHuman + ")";
    $("#hexBody").scrollTop = 0;
  } catch (e) {
    $("#hexMeta").textContent = "error: " + e.message;
  } finally {
    hexBusy = false;
  }
}

document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-navtab]");
  if (t) { selectTab(t.dataset.navtab); return; }
  const c = ev.target.closest("[data-copy]");
  if (c && navigator.clipboard) {
    navigator.clipboard.writeText(c.dataset.copy).then(() => {
      c.textContent = "copied";
      setTimeout(() => c.textContent = "copy", 1200);
    });
  }
});

document.addEventListener("keydown", ev => {
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "o") {
    ev.preventDefault();
    openDialog();
  }
});
$("#openBtn").onclick = openDialog;
$("#exportBtn").onclick = async () => {
  $("#exportBtn").disabled = true;
  try {
    const r = await send("export");
    if (r.exported) toast("Report saved to " + r.path, true);
  } catch (e) { toast("Export failed: " + e.message); }
  finally { $("#exportBtn").disabled = false; }
};

window.addEventListener("resize", debounce(drawEntropy, 150));
</script>
</body>
</html>
